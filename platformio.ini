[env:uptick]
platform  = espressif32 @ 7.1.3
board     = adafruit_matrixportal_esp32s3
framework = arduino

; If the board id above is not found by your PlatformIO install, any 8MB/2MB-PSRAM
; S3 board works as a stand-in (e.g. adafruit_feather_esp32s3) - all pin choices
; come from include/pins.h, not from the board variant.
;
; If the bundled Arduino core is older than 3.x, switch to the pioarduino fork:
;   platform = https://github.com/pioarduino/platform-espressif32/releases/download/<tag>/platform-espressif32.zip

monitor_speed          = 115200
board_build.partitions = partitions_8mb_ota.csv
board_build.filesystem = littlefs

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=3
  ; Panel colour depth. Must be a build flag, not a setting: the DMA library
  ; picks its gamma table from this macro at compile time and uses the table's
  ; output unshifted, so a runtime depth that differs silently drops the top
  ; bit of every bright colour. include/pins.h derives the runtime depth from
  ; this same macro so the two cannot drift. Native tables: 4, 6, 7, 8, 10, 12.
  -DPIXEL_COLOR_DEPTH_BITS=7

lib_deps =
  bblanchon/ArduinoJson@^7.2.0
  mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.15
  adafruit/Adafruit GFX Library@^1.11.9
  adafruit/Adafruit BusIO@^1.16.1

; Bring-up escape hatch only. If the CA bundle symbol does not link against
; your core version, add -DUPTICK_TLS_INSECURE to build_flags to fall back to
; unverified TLS - but do not leave it there.
